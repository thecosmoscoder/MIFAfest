//timer

$(document).ready(function () {
  var targetDate = moment().add(4, 'weeks');

// Update the countdown every second
var interval = setInterval(function () {
    var now = moment();
    var diff = targetDate.diff(now);

    // Check if the target date has already passed
    if (diff <= 0) {
        clearInterval(interval);
        $('.countdown').text("Countdown Ended");
    } else {
        var duration = moment.duration(diff);
        var days = duration.days();
        var hours = duration.hours();
        var minutes = duration.minutes();
        var seconds = duration.seconds();

        // Format the countdown
        var countdownText = days + "d " + hours + "h " + minutes + "m " + seconds + "s";
        $('.countdown').text(countdownText);
    }
}, 1000); // 1000 milliseconds = 1 second


        });

  const scrollPos = $(this).scrollTop();

    divToShow.css("display", "flex");
    
    
  } else {

});
});

// testi home support
$(document).ready(function() {
      // Array of texts to cycle through
      const texts = [
        "John Nail",
        "Haward Hawks",
        "David Lean",
        "Billy Wilder",
      ];

      let currentIndex = 0;

      function changeTextWithFadeOut() {
        // Fade out the current text
        $("#teatiName").fadeOut(500, function() {
          // Update the text with the next one in the array
          $(this).text(texts[currentIndex]);

          // Increment the index for the next iteration
          currentIndex = (currentIndex + 1) % texts.length;

          // Fade in the new text
          $(this).fadeIn(500);
        });
      }

      // Call the function initially and every 2 seconds thereafter
      changeTextWithFadeOut(); // Call initially
      setInterval(changeTextWithFadeOut, 2000); // Call every 2 seconds
    });
