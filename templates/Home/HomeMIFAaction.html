{% extends 'base.html' %}
{% load static %}


{% block content %}
    <style type="text/css">
        .mifa-action__home{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            
        }
        .mifa-action__home span{
            display: none;
            position: absolute;
            z-index: 1;
            font-size: xxx-large;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            border-radius: 10px;
           
        }
        .before___left{
            left: 1%;
        }
        .next___right{
            left: 95%;
        }

        .mifa-action__home:hover span{
            display: block;
            
        }
        .mifa-action__home:hover span:hover{
            background-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .img-mifaaction-co___home{
            width: 100%;
            overflow: hidden;
        }


        .img-mifaaction-co___home img{
            width: 100%;
            height: 90vh;
        }

        .txt-in___mifaaction{
            color: #fff;
            position: absolute;
            display: block;
            left: 3%;
            margin-top: 2rem;
            padding: 10px;
            border: #fff solid 1px;
            border-radius: 10px;
        }
        .txt-in___mifaaction p{
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
    </style>
<section class="mifa-action__home">
<span class="material-symbols-outlined before___left" >navigate_before</span>
<div class="img-mifaaction-co___home">
<div class="txt-in___mifaaction">
        <h1 id="timer"></h1>
        <h1>MIFAauction</h1>
        <p>Meet The Registration for MIFAaction</p>
    </div>
    <img src="{% static './images/MIFAactionHome01.jpg'%}" alt="" id="mifaActionHome" />
</div>
<span class="material-symbols-outlined next___right" >navigate_next</span>
</section>
{% endblock content %}
