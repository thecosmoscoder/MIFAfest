{% extends 'base.html' %}
{% load static %}


{% block content %}
    <style type="text/css">
        .mifa-action__home{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        .mifa-action__home span{
            display: none;
            position: absolute;
            z-index: 1;
            font-size: xxx-large;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            border-radius: 10px;
           
        }
        .before___left{
            left: 1%;
        }
        .next___right{
            left: 95%;
        }

        .mifa-action__home:hover span{
            display: block;
            
        }
        .mifa-action__home:hover span:hover{
            background-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .img-mifaaction-co___home{
            width: 100%;
            overflow: hidden;
        }


        .img-mifaaction-co___home img{
            width: 100%;
            height: 90vh;
        }
    </style>
<section class="mifa-action__home">
<span class="material-symbols-outlined before___left" >navigate_before</span>
<div class="img-mifaaction-co___home">
    <img src="{% static './images/MIFAactionHome01.jpg'%}" alt="" />
    <div>
        <!-- timer-->
        <h1></h1>
        <p></p>
    </div>
</div>
<span class="material-symbols-outlined next___right" >navigate_next</span>
</section>
{% endblock content %}
